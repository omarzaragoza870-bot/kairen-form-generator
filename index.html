<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>KAIREN Form Generator</title><link rel="stylesheet" href="/styles.css">
</head>
<body>
<main class="shell">
<header class="topbar"><div><div class="brand">KAIREN</div><h1>Form Generator</h1><p>Perfiles de formulario + PDF417 genérico de prueba.</p></div><span class="badge">v0.1</span></header>
<section class="layout">
<div class="card">
<div class="head"><div><small>PLANTILLA</small><h2>Datos del formulario</h2></div><select id="profile"></select></div>
<div id="profileNote" class="note"></div>
<div class="grid two">
<label>Nombre<input id="firstName"></label><label>Segundo nombre<input id="middleName"></label>
<label>Apellido<input id="lastName"></label><label>DLN / Folio<input id="dln"></label>
</div>
<div class="grid three">
<label>DOB<input id="dob" placeholder="MM/DD/AAAA"></label><label>ISS<input id="iss" placeholder="MM/DD/AAAA"></label><label>EXP<input id="exp" placeholder="MM/DD/AAAA"></label>
</div>
<div class="grid three">
<label>Sexo<select id="sex"><option>M</option><option>F</option><option>X</option></select></label>
<label>HEIGHT FT<select id="heightFt"><option>5</option><option>6</option></select></label>
<label>HEIGHT IN<select id="heightIn"></select></label>
</div>
<div class="grid two">
<label>EYE<select id="eye"><option>BRO</option><option>BLK</option><option>BLU</option><option>GRN</option><option>GRY</option><option>HAZ</option></select></label>
<label>DD<input id="dd"></label>
</div>
<label id="inventoryWrap">INVENTORY<input id="inventory"></label>
<hr>
<div class="grid two">
<label>Calle<input id="street"></label><label>Ciudad<input id="city"></label>
<label>Estado<input id="addressState" maxlength="2"></label><label>ZIP<input id="zip"></label>
</div>
<div class="actions"><button id="generate" class="primary">Generar PDF417 de prueba</button><button id="fillDemo">Cargar demo</button><button id="clear">Limpiar</button></div>
</div>
<aside class="card previewCard">
<small>PREVISUALIZACIÓN</small><h2>PDF417</h2><div id="preview" class="preview">Aún no hay código generado.</div>
<div class="actions"><button id="download" disabled>Descargar PNG</button><button id="copyPayload">Copiar datos</button></div>
<p class="fine">Modo TEST_FORM_V1. Los perfiles controlan la interfaz y validaciones; no reproducen una codificación oficial de credenciales.</p>
</aside>
</section></main>
<script src="/profiles.js"></script><script src="/app.js"></script>
</body></html>
