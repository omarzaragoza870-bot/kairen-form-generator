<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>KAIREN Form Generator</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="side-title">SECTIONS</div>
    <nav id="sectionNav"></nav>

    <div class="side-title settings-title">Settings</div>

    <label class="side-label">State / Territory
      <select id="profile"></select>
    </label>

    <div id="stateNotice" class="notice"></div>

    <label class="side-label">AAMVA Version
      <select id="version">
        <option value="10">10 — DL/ID-2020</option>
        <option value="09">09 — DL/ID-2016</option>
        <option value="08">08 — DL/ID-2013</option>
      </select>
    </label>

    <label class="side-label">Subfile Type
      <select id="subfile">
        <option value="DL">Driver's License (DL)</option>
        <option value="ID">Identification Card (ID)</option>
      </select>
    </label>

    <label class="check-row">
      <input id="strict" type="checkbox" checked>
      <span><b>Strict Compliance Mode</b><small>Valida campos requeridos de este formulario de prueba.</small></span>
    </label>
  </aside>

  <main class="content">
    <section class="top-tools">
      <div>
        <div class="section-kicker" id="sectionKicker"></div>
        <h1 id="sectionTitle"></h1>
        <p id="sectionDescription"></p>
      </div>

      <div class="toolbar">
        <div class="search-wrap">
          <span>⌕</span>
          <input id="search" placeholder="Search fields (Ctrl+K)">
        </div>
        <label class="tool-check"><input id="requiredOnly" type="checkbox"> Required only</label>
        <button id="nextRequired" class="tool-btn">↓ Next empty required</button>
        <button id="autoFields" class="tool-btn">✣ Generate auto fields</button>
        <button id="autofill" class="tool-btn accent">⚗ Autofill demo</button>
      </div>
      <div class="progress-row">
        <span id="progressText">0/0 required</span>
        <div class="progress"><i id="progressBar"></i></div>
        <span id="fieldCount">0 fields</span>
      </div>
    </section>

    <section id="formArea" class="form-area"></section>

    <footer class="bottom-bar">
      <div>
        <b>PDF417 de prueba</b>
        <span>Genera TEST_FORM_V2 para validar el flujo del formulario.</span>
      </div>
      <div class="bottom-actions">
        <button id="copyData">Copiar JSON</button>
        <button id="generate" class="primary">Generar PDF417 de prueba</button>
      </div>
    </footer>

    <div id="previewModal" class="modal hidden">
      <div class="modal-card">
        <div class="modal-head">
          <div><small>PREVIEW</small><h2>PDF417 de prueba</h2></div>
          <button id="closeModal" class="icon-btn">×</button>
        </div>
        <div id="preview" class="preview">Aún no hay imagen.</div>
        <div class="modal-actions">
          <button id="download" disabled>Descargar PNG</button>
          <button id="closeModal2">Cerrar</button>
        </div>
      </div>
    </div>
  </main>
</div>
<script src="/profiles.js"></script>
<script src="/app.js"></script>
</body>
</html>
